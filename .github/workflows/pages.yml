# Publishes the Flashout app (the flashout/ folder) to GitHub Pages.
name: Deploy Flashout to GitHub Pages

# On hold: runs only when started by hand (Actions -> Deploy Flashout to GitHub Pages -> Run workflow).
# To publish automatically again, add back:
#   push:
#     branches: [main]
#     paths: ['flashout/**', '.github/workflows/pages.yml']
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the app folder; skips the large fixture export folders.
          sparse-checkout: flashout
          sparse-checkout-cone-mode: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flashout
      - id: deployment
        uses: actions/deploy-pages@v4
